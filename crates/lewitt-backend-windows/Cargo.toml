[package]
name = "lewitt-backend-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lewitt-core.workspace = true

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
